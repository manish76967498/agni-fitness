<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    ```
    <title>Edit Member - {{ site.name }}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    ```

</head>

<body>

    ```
    <div class="register-box">

        <h1>🏋️ Edit Member</h1>

        <form action="/edit/{{ member[0] }}" method="POST">

            <input type="text" name="name" value="{{ member[1] }}" placeholder="Full Name" required>

            <br><br>

            <input type="email" name="email" value="{{ member[2] }}" placeholder="Email" required>

            <br><br>

            <input type="text" name="phone" value="{{ member[3] }}" placeholder="Phone Number" required>

            <br><br>

            <select name="membership" required>

                <option value="">Select Membership</option>

                <option value="Monthly" {% if member[4]=="Monthly" %}selected{% endif %}>
                    Monthly
                </option>

                <option value="3 Months" {% if member[4]=="3 Months" %}selected{% endif %}>
                    3 Months
                </option>

                <option value="6 Months" {% if member[4]=="6 Months" %}selected{% endif %}>
                    6 Months
                </option>

                <option value="Yearly" {% if member[4]=="Yearly" %}selected{% endif %}>
                    Yearly
                </option>

            </select>

            <br><br>

            <label for="start_date">Start Date:</label>

            <input type="text" id="start_date" name="start_date" value="{{ member[5] }}" placeholder="Select start date"
                required readonly>

            <br><br>

            <button type="submit">Update Member</button>

        </form>

        <br>

        <a href="/admin">← Back to Dashboard</a>

    </div>
    ```
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <script>
        flatpickr("#start_date", {
            dateFormat: "d-m-Y",
            allowInput: false
        });
    </script>
</body>

</html>
